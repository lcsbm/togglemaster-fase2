# ATENÇÃO: substitua os valores pelos base64 reais após provisionar o RDS.
# Para codificar: echo -n "valor" | base64
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: togglemaster
type: Opaque
data:
  # echo -n "postgres://<user>:<pass>@<rds-endpoint>:5432/auth_db?sslmode=require" | base64
  DATABASE_URL: SUBSTITUIR_BASE64
  # echo -n "minha-master-key-segura" | base64
  MASTER_KEY: SUBSTITUIR_BASE64
