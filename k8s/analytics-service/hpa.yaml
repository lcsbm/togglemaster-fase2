# FALLBACK: Use este HPA somente se NÃO estiver usando KEDA.
# Com KEDA ativo (keda-scaledobject.yaml aplicado), NÃO aplique este arquivo —
# o KEDA cria seu próprio HPA internamente e os dois conflitam.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-service-hpa
  namespace: togglemaster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
